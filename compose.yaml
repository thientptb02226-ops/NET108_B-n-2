services:
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "127.0.0.1:1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Net108Khai!2026Dev}
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
  migrate:
    build: .
    image: net108khai-api:local
    command: ["--migrate"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Commerce: Server=db,1433;Database=net108khai;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Net108Khai!2026Dev};Encrypt=True;TrustServerCertificate=True
      Demo__SeedProducts: "true"
      DataProtection__KeyPath: /app/keys
    depends_on:
      db:
        condition: service_healthy
  api:
    build: .
    image: net108khai-api:local
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Commerce: Server=db,1433;Database=net108khai;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Net108Khai!2026Dev};Encrypt=True;TrustServerCertificate=True
      Cors__Origins__0: ${FRONTEND_ORIGIN:-http://localhost:3000}
      Frontend__AuthCallbackUrl: ${AUTH_CALLBACK_URL:-http://localhost:3000/auth/callback}
      Smtp__Host: mailpit
      Smtp__Port: "1025"
      Smtp__From: no-reply@net108khai.local
      Smtp__EnableSsl: "false"
      DataProtection__KeyPath: /app/keys
      OAuth__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      OAuth__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      OAuth__Facebook__ClientId: ${FACEBOOK_APP_ID:-}
      OAuth__Facebook__ClientSecret: ${FACEBOOK_APP_SECRET:-}
      Ai__Endpoint: ${AI_ENDPOINT:-}
      Ai__Model: ${AI_MODEL:-}
      Ai__ApiKey: ${AI_API_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    volumes:
      - protection_keys:/app/keys

volumes:
  sqlserver_data:
  protection_keys:
