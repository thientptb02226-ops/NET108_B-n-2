<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bộ Chọn Mẫu Mã 3D — Maison Vell Runway</title>
<meta name="description" content="Trình chọn mẫu mã và phối đồ trực quan 3D theo chiều sâu sàn diễn runway.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Michroma&display=swap" rel="stylesheet">
<style>
:root{
  --u:min(calc(100vw/1440),calc(100vh/900));
  --ink:#16191f;
  --mid:#4b5563;
  --dim:#6b7280;
  --line:#e5e7eb;
  --accent:#08482d;
  --accent-light:#dae7c7;
  --bg-stage:linear-gradient(transparent 60%,rgba(255,255,255,.72) 100%),linear-gradient(90deg,#f1f5fa 0%,#e7eff6 38%,#eef4f9 62%,#f6f9fc 100%);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;width:100%;background:#fff}
body{
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
  user-select:none;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wide{font-family:Michroma,sans-serif;text-transform:uppercase}

.page{
  height:100vh;
  width:100%;
  background:#fff;
  position:relative;
  overflow:hidden;
}

main{
  position:relative;
  display:grid;
  grid-template-columns:1fr calc(340*var(--u));
  height:100%;
  width:100%;
  min-height:0;
  overflow:hidden;
}

/* 1. Stage with 3D Runway Models */
.stage{
  position:relative;
  overflow:hidden;
  min-width:0;
  touch-action:pan-y;
  cursor:grab;
  background:var(--bg-stage);
}
.stage:active{cursor:grabbing}
.line{position:absolute;inset:0}
.m{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform,filter;pointer-events:none}
.m svg{display:block;position:relative;width:100%;height:100%}
.m:before{
  content:"";position:absolute;left:8%;right:8%;bottom:-1.6%;height:3.6%;
  border-radius:50%;background:radial-gradient(closest-side,rgba(70,85,105,.28),transparent);
}

/* Floating Prev / Next Navigation Arrows on Stage */
.stage-nav{
  position:absolute;
  top:42%;
  transform:translateY(-50%);
  z-index:20;
  width:calc(46*var(--u));
  height:calc(46*var(--u));
  border-radius:99px;
  background:#ffffff;
  border:1px solid rgba(0,0,0,.1);
  box-shadow:0 8px 24px -4px rgba(0,0,0,.15);
  display:flex;
  align-items:center;
  justify-content:center;
  transition:all .2s ease;
  cursor:pointer;
}
.stage-nav svg{width:calc(20*var(--u));height:calc(20*var(--u));stroke:var(--ink);stroke-width:2.2;fill:none}
.stage-nav:hover{
  background:var(--ink);
  border-color:var(--ink);
  transform:translateY(-50%) scale(1.08);
}
.stage-nav:hover svg{stroke:#fff}
.stage-nav.prev{left:calc(18*var(--u))}
.stage-nav.next{right:calc(18*var(--u))}

/* 2. Variant Selector & Product Options Dock */
.dock{
  position:absolute;
  bottom:calc(16*var(--u));
  left:50%;
  transform:translateX(-50%);
  z-index:150;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:calc(8*var(--u));
  width:calc(100% - calc(32*var(--u)));
  max-width:calc(820*var(--u));
  pointer-events:none;
}

/* Look Chips (Row 1) */
.chips-wrap{
  pointer-events:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:calc(6*var(--u));
  padding:calc(4*var(--u)) calc(8*var(--u));
  background:#ffffff;
  border:1px solid #d1d5db;
  border-radius:99px;
  box-shadow:0 8px 20px -4px rgba(0,0,0,.12);
  width:fit-content;
  max-width:100%;
}
.chip{
  padding:calc(5*var(--u)) calc(12*var(--u));
  border-radius:99px;
  font-size:calc(11*var(--u));
  font-weight:600;
  color:var(--mid);
  background:transparent;
  border:1px solid transparent;
  white-space:nowrap;
  transition:background-color .15s ease, color .15s ease;
  display:flex;
  align-items:center;
  gap:calc(6*var(--u));
  cursor:pointer;
}
.chip:hover{color:var(--ink);background:#f3f4f6}
.chip.active{
  background:var(--ink);
  color:#fff;
  border-color:var(--ink);
  box-shadow:0 2px 8px rgba(22,25,31,.25);
  font-weight:700;
}
.chip-num{
  font-family:Michroma,sans-serif;
  font-size:calc(9.5*var(--u));
  opacity:.9;
}

/* Detailed Options & Purchase Card (Row 2) */
.options-card{
  pointer-events:auto;
  width:100%;
  background:#ffffff;
  border:1px solid #d1d5db;
  border-radius:calc(18*var(--u));
  box-shadow:0 14px 32px -6px rgba(0,0,0,.18);
  padding:calc(12*var(--u)) calc(18*var(--u));
  display:flex;
  flex-direction:column;
  gap:calc(10*var(--u));
}

/* Header line inside Card */
.card-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid #f1f5fa;
  padding-bottom:calc(8*var(--u));
  gap:calc(12*var(--u));
}
.card-title-group{
  display:flex;
  align-items:center;
  gap:calc(8*var(--u));
  min-width:0;
}
.look-badge{
  font-family:Michroma,sans-serif;
  font-size:calc(10.5*var(--u));
  background:var(--ink);
  color:#fff;
  padding:calc(3*var(--u)) calc(8*var(--u));
  border-radius:4px;
  letter-spacing:.06em;
  white-space:nowrap;
}
.look-title{
  font-size:calc(13*var(--u));
  font-weight:700;
  color:var(--ink);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.card-price-group{
  display:flex;
  align-items:baseline;
  gap:calc(6*var(--u));
  white-space:nowrap;
  flex-shrink:0;
}
.card-usd{
  font-size:calc(16.5*var(--u));
  font-weight:700;
  color:var(--ink);
}
.card-vnd{
  font-size:calc(12*var(--u));
  font-weight:500;
  color:var(--mid);
}

/* Options Selector Rows */
.selector-body{
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:calc(10*var(--u));
}
.selector-group{
  display:flex;
  align-items:center;
  gap:calc(8*var(--u));
}
.group-label{
  font-size:calc(11.5*var(--u));
  font-weight:600;
  color:var(--dim);
  text-transform:uppercase;
  letter-spacing:.04em;
  white-space:nowrap;
}
.pills-list{
  display:flex;
  align-items:center;
  gap:calc(6*var(--u));
}
.pill-btn{
  padding:calc(5*var(--u)) calc(10*var(--u));
  border-radius:calc(8*var(--u));
  font-size:calc(11.5*var(--u));
  font-weight:600;
  color:var(--mid);
  background:#f3f4f6;
  border:1px solid #e5e7eb;
  transition:all .15s ease;
  white-space:nowrap;
  cursor:pointer;
}
.pill-btn:hover{
  background:#e5e7eb;
  color:var(--ink);
}
.pill-btn.active{
  background:#08482d;
  color:#fff;
  border-color:#08482d;
  box-shadow:0 2px 6px rgba(8,72,45,.25);
}

/* Quantity Counter */
.qty-counter{
  display:inline-flex;
  align-items:center;
  border:1px solid #d1d5db;
  border-radius:calc(8*var(--u));
  background:#f9fafb;
  overflow:hidden;
}
.qty-btn{
  width:calc(28*var(--u));
  height:calc(28*var(--u));
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:calc(14*var(--u));
  font-weight:700;
  color:var(--ink);
  background:#ffffff;
  transition:background .15s;
  cursor:pointer;
}
.qty-btn:hover{background:#f3f4f6}
.qty-btn:active{background:#e5e7eb}
.qty-btn:disabled{opacity:.4;cursor:not-allowed}
.qty-val{
  min-width:calc(32*var(--u));
  text-align:center;
  font-size:calc(12*var(--u));
  font-weight:700;
  color:var(--ink);
}
.stock-tag{
  font-size:calc(11*var(--u));
  color:#059669;
  font-weight:600;
  margin-left:calc(4*var(--u));
  white-space:nowrap;
}

/* Action Buttons Row */
.card-bottom{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:calc(12*var(--u));
  padding-top:calc(4*var(--u));
  border-top:1px solid #f1f5fa;
}
.total-summary{
  display:flex;
  align-items:baseline;
  gap:calc(6*var(--u));
}
.total-label{
  font-size:calc(11.5*var(--u));
  color:var(--dim);
}
.total-amount{
  font-size:calc(16*var(--u));
  font-weight:800;
  color:var(--ink);
}
.buttons-group{
  display:flex;
  align-items:center;
  gap:calc(8*var(--u));
}
.btn-cart{
  display:inline-flex;
  align-items:center;
  gap:calc(6*var(--u));
  height:calc(38*var(--u));
  padding:0 calc(16*var(--u));
  border-radius:calc(10*var(--u));
  background:#eef6ee;
  color:#08482d;
  border:1px solid #cce5cc;
  font-size:calc(12.5*var(--u));
  font-weight:700;
  transition:all .2s ease;
  cursor:pointer;
  white-space:nowrap;
}
.btn-cart:hover{
  background:#dae7c7;
  transform:scale(1.02);
}
.btn-cart svg{width:calc(15*var(--u));height:calc(15*var(--u));stroke:currentColor;stroke-width:2;fill:none}

.btn-buy{
  display:inline-flex;
  align-items:center;
  gap:calc(6*var(--u));
  height:calc(38*var(--u));
  padding:0 calc(20*var(--u));
  border-radius:calc(10*var(--u));
  background:#08482d;
  color:#fff;
  border:1px solid #08482d;
  font-size:calc(12.5*var(--u));
  font-weight:700;
  box-shadow:0 4px 12px rgba(8,72,45,.28);
  transition:all .2s ease;
  cursor:pointer;
  white-space:nowrap;
}
.btn-buy:hover{
  background:#0b5c39;
  transform:scale(1.02);
}
.btn-buy:active,.btn-cart:active{transform:scale(.98)}

/* 3. Product Accessories Rail (Scrollable & Draggable Up/Down) */
.rail{
  position:relative;
  overflow:hidden;
  background:#f8fafc;
  border-left:1px solid var(--line);
  min-height:0;
  cursor:grab;
  touch-action:pan-y;
  user-select:none;
}
.rail:active{cursor:grabbing}
.card{
  position:absolute;left:0;top:0;width:100%;
  display:flex;flex-direction:column;
  padding:calc(14*var(--u)) calc(18*var(--u));
  will-change:transform;background:#f8fafc;
  border-bottom:1px solid rgba(226,232,240,.7);
}
.card.alt{background:#fff}
.fav{
  position:absolute;left:calc(18*var(--u));top:calc(14*var(--u));
  width:calc(20*var(--u));height:calc(20*var(--u));z-index:1;color:var(--ink);
  cursor:pointer;
}
.fav svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.4;transition:fill .2s}
.fav[aria-pressed=true] svg{fill:#f43f5e;stroke:#e11d48}
.shot{flex:1;min-height:0;display:block}
.shot svg{display:block;width:100%;height:100%}
.meta{
  display:grid;grid-template-columns:1fr auto;
  align-items:end;margin-top:calc(6*var(--u));
}
.meta h3{font-size:calc(12*var(--u));font-weight:600;letter-spacing:.02em}
.meta span{
  display:block;grid-column:1;margin-top:calc(4*var(--u));
  font-size:calc(13*var(--u));font-weight:700;color:var(--accent);
}
.add{
  grid-column:2;grid-row:1/3;width:calc(28*var(--u));height:calc(28*var(--u));
  border-radius:calc(8*var(--u));background:var(--accent-light);color:var(--accent);
  position:relative;transition:all .2s;display:flex;align-items:center;justify-content:center;
  cursor:pointer;
}
.add:before,.add:after{
  content:"";position:absolute;left:50%;top:50%;width:calc(13*var(--u));height:2px;
  margin:-1px 0 0 calc(-6.5*var(--u));background:currentColor;border-radius:1px;
}
.add:after{transform:rotate(90deg)}
.add:hover{background:var(--accent);color:#fff;transform:scale(1.08)}

/* Cursor Ring */
.ring{
  position:absolute;z-index:4;left:0;top:0;
  width:calc(42*var(--u));height:calc(42*var(--u));margin:calc(-21*var(--u)) 0 0 calc(-21*var(--u));
  border:calc(2*var(--u)) solid var(--ink);border-radius:99px;
  pointer-events:none;opacity:0;
  transition:width .22s cubic-bezier(.2,.8,.2,1),height .22s cubic-bezier(.2,.8,.2,1),margin .22s cubic-bezier(.2,.8,.2,1),opacity .2s;
}
.ring.show{opacity:.75}
.ring.drag{width:calc(76*var(--u));height:calc(30*var(--u));margin:calc(-15*var(--u)) 0 0 calc(-38*var(--u))}

/* Toast notification */
.toast{
  position:fixed;top:calc(24*var(--u));left:50%;transform:translateX(-50%) translateY(-20px);
  z-index:99;background:var(--ink);color:#fff;font-size:calc(12*var(--u));font-weight:600;
  padding:calc(10*var(--u)) calc(20*var(--u));border-radius:99px;box-shadow:0 12px 30px rgba(0,0,0,.25);
  opacity:0;pointer-events:none;transition:all .3s cubic-bezier(.2,.8,.2,1);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Mobile Responsive */
@media (max-width:820px){
  :root{--u:1px}
  main{grid-template-columns:1fr;grid-template-rows:1fr 140px}
  .rail{border-left:0;border-top:1px solid var(--line)}
  .card{width:125px;height:100%;padding:6px}
  .dock{bottom:8px;width:calc(100% - 14px);gap:5px}
  .chips-wrap{padding:2px 6px;gap:4px;overflow-x:auto;justify-content:flex-start;scrollbar-width:none;-ms-overflow-style:none}
  .chips-wrap::-webkit-scrollbar{display:none}
  .chip{padding:4px 8px;font-size:10px}
  .options-card{padding:8px 10px;gap:6px;border-radius:12px;background:rgba(255,255,255,0.96);backdrop-filter:blur(10px)}
  .card-top{padding-bottom:4px}
  .look-title{font-size:11.5px}
  .card-usd{font-size:14px}
  .card-vnd{display:none}
  .selector-body{gap:4px;overflow-x:auto;max-width:100%;white-space:nowrap;scrollbar-width:none}
  .selector-body::-webkit-scrollbar{display:none}
  .pills-list{overflow-x:auto;scrollbar-width:none}
  .pills-list::-webkit-scrollbar{display:none}
  .group-label{font-size:9.5px}
  .pill-btn{padding:3px 6px;font-size:10px}
  .qty-btn{width:22px;height:22px;font-size:12px}
  .qty-val{min-width:20px;font-size:11px}
  .stock-tag{display:none}
  .card-bottom{padding-top:4px;flex-direction:column;align-items:stretch;gap:4px}
  .total-summary{display:flex;justify-content:space-between;align-items:baseline;width:100%}
  .total-label{font-size:10px}
  .total-amount{font-size:13px}
  .buttons-group{display:flex;width:100%;gap:6px;margin-left:0}
  .btn-cart{flex:1;justify-content:center;height:32px;padding:0 6px;font-size:10.5px}
  .btn-buy{flex:1;justify-content:center;height:32px;padding:0 6px;font-size:10.5px}
  .stage-nav{width:32px;height:32px}
  .stage-nav.prev{left:6px}
  .stage-nav.next{right:6px}
  .ring{display:none}
}
</style>
</head>
<body>
<div class="page">
  <main>
    <!-- Stage with 3D Runway Models -->
    <section class="stage" id="stage" aria-label="Sàn diễn thời trang 3D. Kéo, vuốt hoặc dùng phím mũi tên để chuyển mẫu mã." tabindex="0">
      <div class="line" id="line"></div>

      <!-- Navigation Arrows to switch products/looks -->
      <button class="stage-nav prev" id="prevBtn" aria-label="Xem mẫu trước (Phím ←)" title="Mẫu trước">
        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <button class="stage-nav next" id="nextBtn" aria-label="Xem mẫu sau (Phím →)" title="Mẫu tiếp theo">
        <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
      </button>

      <!-- Bottom Dock: Looks Chips + Product Options & Quantity Card -->
      <div class="dock">
        <!-- Row 1: Looks Chips -->
        <div class="chips-wrap" id="chipsWrap" aria-label="Danh sách các mẫu mã"></div>

        <!-- Row 2: Comprehensive Options & Order Card -->
        <div class="options-card">
          <!-- Top: Name & Price -->
          <div class="card-top">
            <div class="card-title-group">
              <span class="look-badge" id="cardLookBadge">LOOK 15</span>
              <h2 class="look-title" id="cardLookTitle">Feather Jacket & Satin Trousers</h2>
            </div>
            <div class="card-price-group">
              <span class="card-usd" id="cardPriceUsd">$2,900</span>
              <span class="card-vnd" id="cardPriceVnd">(~73.660.000 ₫)</span>
            </div>
          </div>

          <!-- Middle: Variant Options, Sizes & Quantity Counter -->
          <div class="selector-body">
            <!-- 1. Loại hàng / Phân loại (Options) -->
            <div class="selector-group">
              <span class="group-label">Phân loại:</span>
              <div class="pills-list" id="optionPills"></div>
            </div>

            <!-- 2. Kích cỡ (Sizes) -->
            <div class="selector-group">
              <span class="group-label">Kích cỡ:</span>
              <div class="pills-list" id="sizePills">
                <button type="button" class="pill-btn active" data-size="S">S</button>
                <button type="button" class="pill-btn" data-size="M">M</button>
                <button type="button" class="pill-btn" data-size="L">L</button>
              </div>
            </div>

            <!-- 3. Số lượng mua -->
            <div class="selector-group">
              <span class="group-label">Số lượng:</span>
              <div class="qty-counter">
                <button type="button" id="qtyMinus" class="qty-btn" aria-label="Giảm số lượng">−</button>
                <span id="qtyVal" class="qty-val">1</span>
                <button type="button" id="qtyPlus" class="qty-btn" aria-label="Tăng số lượng">+</button>
              </div>
              <span class="stock-tag" id="stockTag">✓ Còn 18 sản phẩm</span>
            </div>
          </div>

          <!-- Bottom: Dynamic Total & Action Buttons -->
          <div class="card-bottom">
            <div class="total-summary">
              <span class="total-label">Tổng tạm tính:</span>
              <span class="total-amount" id="totalAmount">73.660.000 ₫</span>
            </div>
            <div class="buttons-group">
              <button type="button" class="btn-cart" id="addToCartBtn" aria-label="Thêm sản phẩm vào giỏ hàng">
                <svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
                <span>Thêm vào giỏ</span>
              </button>
              <button type="button" class="btn-buy" id="buyNowBtn" aria-label="Mua ngay và thanh toán">
                <span>Mua ngay</span>
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="ring" id="ring"></div>
    </section>

    <!-- Synchronized Product Pieces Rail (Interactive up/down scroll & drag) -->
    <aside class="rail" id="rail" aria-label="Các món phụ kiện & trang phục trong mẫu đang chọn"></aside>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
// Sprite Sheets
const MODELS='https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20261102_042056_1a704ff7-b0e5-4a9f-bbda-62392b819fb6.png&w=3840&q=85';
const PIECES='https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20261102_042057_080e85b0-b4aa-4072-8eb9-2304c7baf42b.png&w=2400&q=85';

// 6 Looks measured on 960x540 models sheet
const LOOKS=[[12,176],[178,330],[331,470],[476,633],[634,767],[767,956]],Y0=48,Y1=496,FIRST=15;

const LOOK_METAS=[
  {
    num: 15,
    short: 'Feather & Satin',
    full: 'Look 15: Áo Khoác Lông Vũ & Quần Lụa Satin',
    price: '$2,900',
    priceVnd: '73.660.000 ₫',
    options: [
      { name: 'Trọn bộ Look 15', price: '$2,900', priceNum: 2900, priceVnd: '73.660.000 ₫' },

  {

    options: [
      { name: 'Trọn bộ Look 19', price: '$1,980', priceNum: 1980, priceVnd: '50.292.000 ₫' },
      { name: 'Áo Khoác Powder Long Coat', price: '$1,980', priceNum: 1980, priceVnd: '50.292.000 ₫' },
      { name: 'Quần Ivory Straight Pants', price: '$690', priceNum: 690, priceVnd: '17.526.000 ₫' }

  {

    options: [
      { name: 'Trọn bộ Look 20', price: '$1,340', priceNum: 1340, priceVnd: '34.036.000 ₫' },
      { name: 'Áo Sculpted Ruffle Top', price: '$1,120', priceNum: 1120, priceVnd: '28.448.000 ₫' },
      { name: 'Chân váy Pleated Maxi Skirt', price: '$1,340', priceNum: 1340, priceVnd: '34.036.000 ₫' }
    ]

];

// 12 Pieces measured on 960x720 sheet
const ITEMS=[
  [26,224,28,214,'Feather Jacket','$2,900'],[304,412,22,236,'Satin Wide Leg Trousers','$1,450'],
  [530,666,12,242,'Pleated Dress','$2,200'],[752,922,100,146,'Gold Waist Belt','$420'],
  [70,176,246,466,'Satin Trench Dress','$2,350'],[294,422,294,432,'Top Handle Bag','$980'],
  [508,688,240,452,'Billow Sleeve Blouse','$860'],[780,890,252,466,'Tie Waist Trousers','$740'],
  [64,178,484,698,'Powder Long Coat','$1,980'],[316,396,482,698,'Ivory Straight Trousers','$690'],
  [530,672,508,682,'Sculpted Ruffle Top','$1,120'],[754,916,484,700,'Pleated Maxi Skirt','$1,340']
];

// 7 Depth Stops from d = -1 to d = 5
const KX=[1.2,.744,.496,.346,.235,.15,.085],KF=[1.14,.89,.777,.704,.651,.616,.59],KH=[1.18,.832,.574,.436,.334,.258,.19],
      KB=[0,0,1.5,4,8,12,17],KO=[1,1,1,1,.86,.5,0];

const N=LOOKS.length, $=id=>document.getElementById(id), calm=matchMedia('(prefers-reduced-motion:reduce)').matches;
const stage=$('stage'), rail=$('rail'), ring=$('ring'), line=$('line'), chipsWrap=$('chipsWrap'), optionPills=$('optionPills');
const NS='http://www.w3.org/2000/svg', wrap=(x,n)=>((x%n)+n)%n;

function crop(href,x0,y0,w,h,sheetW,sheetH){
  const s=document.createElementNS(NS,'svg');s.setAttribute('viewBox',`${x0} ${y0} ${w} ${h}`);s.setAttribute('aria-hidden','true');
  const f=document.createElementNS(NS,'svg');[['x',x0],['y',y0],['width',w],['height',h],['viewBox',`${x0} ${y0} ${w} ${h}`]].forEach(([k,v])=>f.setAttribute(k,v));
  const i=document.createElementNS(NS,'image');i.setAttribute('href',href);i.setAttribute('width',sheetW);i.setAttribute('height',sheetH);f.append(i);s.append(f);return s;
}

// Models
const people=LOOKS.map(([a,b],i)=>{
  const e=document.createElement('div');e.className='m';e.dataset.i=i;e.append(crop(MODELS,a,Y0,b-a,Y1-Y0,960,540));line.append(e);
  return{e,r:(b-a)/(Y1-Y0),f:'',o:''};
});

// Pieces rail
const cards=ITEMS.map(([a,b,c,d,name,price],i)=>{
  const e=document.createElement('article');e.className='card'+(i%2?' alt':'');
  e.innerHTML=`<button class="fav" aria-pressed="false" aria-label="Yêu thích ${name}"><svg viewBox="0 0 24 24"><path d="M12 20S3.5 15 3.5 9A4.6 4.6 0 0 1 12 6.6 4.600 4.600 0 0 1 20.500 9C20.500 15 12 20 12 20Z"/></svg></button><span class="shot"></span><div class="meta"><h3>${name}</h3><span>${price}</span><button class="add" aria-label="Thêm ${name} vào giỏ" title="Thêm vào giỏ"></button></div>`;
  e.querySelector('.shot').append(crop(PIECES,a,c,b-a,d-c,960,720));rail.append(e);return e;
});

// Render Chips for Looks (Row 1)
const chips=[];
LOOK_METAS.forEach((meta, idx)=>{
  const chip=document.createElement('button');
  chip.className='chip'+(idx===0?' active':'');
  chip.innerHTML=`<span class="chip-num">L${meta.num}</span> <span>${meta.short}</span>`;
  chip.addEventListener('click', ()=>{
    goToLook(idx);
  });
  chipsWrap.append(chip);
  chips.push(chip);
});

// Toast Feedback Helper
function showToast(msg){
  const t=$('toast');
  if(!t)return;
  t.textContent=msg;
  t.classList.add('show');
  setTimeout(()=>{t.classList.remove('show')},2200);
}

// State for user selection
let currentLookIndex = 0;
let currentOptionIndex = 0;
let currentSize = 'S';
let currentQty = 1;

// Initial look from query params
try {
  const pms = new URLSearchParams(window.location.search);
  const lookParam = pms.get('look');
  if (lookParam !== null) {
    const parsed = parseInt(lookParam, 10);
    if (!isNaN(parsed) && parsed >= 0 && parsed < N) currentLookIndex = parsed;
  }
} catch(_){}

let W=0,H=0,base=0,cardS=0,side=false,dirty=true,p=currentLookIndex,target=currentLookIndex,last=0;

function formatMoneyVnd(amount){
  return amount.toLocaleString('vi-VN') + ' ₫';
}

function updateLookUI(activeIdx){
  currentLookIndex = activeIdx;
  const meta = LOOK_METAS[activeIdx];
  if(!meta)return;

  // Header line
  $('cardLookBadge').textContent = `LOOK ${meta.num}`;
  $('cardLookTitle').textContent = meta.full;

  // Populate options pills
  optionPills.innerHTML = '';
  meta.options.forEach((opt, optIdx)=>{
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'pill-btn' + (optIdx === currentOptionIndex ? ' active' : '');
    btn.textContent = opt.name;
    btn.addEventListener('click', ()=>{
      currentOptionIndex = optIdx;
      updateOptionAndTotal();
      document.querySelectorAll('#optionPills .pill-btn').forEach((b, i)=>{
        b.classList.toggle('active', i === optIdx);
      });
    });
    optionPills.append(btn);
  });

  // Highlight look chips
  chips.forEach((c, i)=>{
    c.classList.toggle('active', i === activeIdx);
  });

  updateOptionAndTotal();
}

function updateOptionAndTotal(){
  const meta = LOOK_METAS[currentLookIndex];
  if(!meta)return;
  const opt = meta.options[currentOptionIndex] || meta.options[0];
  
  $('cardPriceUsd').textContent = opt.price;
  $('cardPriceVnd').textContent = `(~${opt.priceVnd})`;

  // Total = option.priceNum * 25400 * currentQty
  const unitVnd = opt.priceNum * 25400;
  const totalVnd = unitVnd * currentQty;
  $('totalAmount').textContent = formatMoneyVnd(totalVnd);
}

// Quantity Counter listeners
$('qtyMinus').addEventListener('click', ()=>{
  if(currentQty > 1){
    currentQty--;
    $('qtyVal').textContent = currentQty;
    updateOptionAndTotal();
  }
});
$('qtyPlus').addEventListener('click', ()=>{
  if(currentQty < 20){
    currentQty++;
    $('qtyVal').textContent = currentQty;
    updateOptionAndTotal();
  }
});

// Size Pills listeners
document.querySelectorAll('#sizePills .pill-btn').forEach(btn => {
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('#sizePills .pill-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentSize = btn.dataset.size || 'S';
  });
});

// Add To Cart & Buy Now Handlers
function sendCartAction(isBuyNow = false){
  const meta = LOOK_METAS[currentLookIndex];
  const opt = meta.options[currentOptionIndex] || meta.options[0];
  const payload = {
    type: 'RUNWAY_ADD_TO_CART',
    name: meta.full,
    option: opt.name,
    size: currentSize,
    price: opt.price,
    quantity: currentQty,
    buyNow: isBuyNow
  };
  try {
    if(window.parent && window.parent !== window){
      window.parent.postMessage(payload, '*');
    }
  } catch(_){}
  showToast(`✓ Đã thêm ${currentQty}x ${opt.name} (Size ${currentSize}) vào giỏ!`);
}

$('addToCartBtn').addEventListener('click', () => sendCartAction(false));
$('buyNowBtn').addEventListener('click', () => sendCartAction(true));

function goToLook(idx){
  const currentInt = Math.round(target);
  let diff = wrap(idx - wrap(currentInt, N), N);
  if (diff > N / 2) diff -= N;
  target = currentInt + diff;
}

// Rail click handler (add piece to cart)
rail.addEventListener('click',e=>{
  const f=e.target.closest('.fav');if(f)f.setAttribute('aria-pressed',f.getAttribute('aria-pressed')!=='true');
  const addBtn=e.target.closest('.add');
  if(addBtn){
    const card=addBtn.closest('.card');
    const name=card.querySelector('h3')?.textContent||'Maison Vell Piece';
    const price=card.querySelector('span')?.textContent||'$1,000';
    try {
      if(window.parent && window.parent !== window){
        window.parent.postMessage({ type: 'RUNWAY_ADD_TO_CART', name, price, quantity: 1 }, '*');
      }
    } catch(_){}
    showToast(`✓ Đã thêm "${name}" vào giỏ hàng`);
  }
});

// Arrow Navigation
$('prevBtn').addEventListener('click', ()=>{
  target = Math.round(target) - 1;
});
$('nextBtn').addEventListener('click', ()=>{
  target = Math.round(target) + 1;
});

function size(){
  W=stage.clientWidth;H=stage.clientHeight;base=H*1.2;side=innerWidth<=820;
  people.forEach(m=>{m.e.style.width=base*m.r+'px';m.e.style.height=base+'px'});
  cardS=side?125:rail.clientHeight/2.4;
  cards.forEach(c=>c.style.height=side?'100%':cardS+'px');
  dirty=true;
}
addEventListener('resize',size);

function paint(){
  people.forEach((m,i)=>{
    let d=wrap(i-p,N);if(d>N-1)d-=N;
    const k=clamp(d+1,0,6),a=Math.floor(k),b=Math.min(6,a+1),t=k-a,mix=A=>A[a]+(A[b]-A[a])*t;
    const h=mix(KH)*H,s=h/base,w=h*m.r,x=mix(KX)*W-w/2,y=mix(KF)*H-h;
    m.e.style.transform=`translate3d(${x.toFixed(1)}px,${y.toFixed(1)}px,0) scale(${s.toFixed(4)})`;
    const f=mix(KB)/s,fs=f<.2?'none':`blur(${f.toFixed(1)}px)`,o=mix(KO).toFixed(3);
    if(fs!==m.f){m.f=fs;m.e.style.filter=fs}
    if(o!==m.o){m.o=o;m.e.style.opacity=o}
    m.e.style.zIndex=100-Math.round(d*10);
  });
  const all=cardS*ITEMS.length;
  cards.forEach((c,i)=>{
    let y=wrap(i*cardS-p*2*cardS,all);if(y>all-cardS)y-=all;
    c.style.transform=side?`translate3d(${y.toFixed(1)}px,0,0)`:`translate3d(0,${y.toFixed(1)}px,0)`;
  });

  // Update Look UI when p changes
  const activeIdx = wrap(Math.round(p), N);
  if(activeIdx !== currentLookIndex){
    updateLookUI(activeIdx);
  }
}
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));

function frame(now){
  const dt=Math.min(50,now-last)||16;last=now;
  const was=p;
  if(calm)p=target;else p+=(target-p)*(1-Math.exp(-dt*.0072));
  if(Math.abs(target-p)<.0004)p=target;
  if(p!==was||dirty){dirty=false;paint()}
  cx+=(mx-cx)*.32;cy+=(my-cy)*.32;
  ring.style.transform=`translate3d(${cx.toFixed(1)}px,${cy.toFixed(1)}px,0)`;
}

// Stage pointer events
let mx=0,my=0,cx=0,cy=0,down=false,sx=0,st=0,moved=0,wheelT=0;
const PULL=()=>Math.max(150,W*.22);
stage.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')ring.classList.add('show')});
stage.addEventListener('pointerleave',()=>ring.classList.remove('show'));
stage.addEventListener('pointermove',e=>{
  const r=stage.getBoundingClientRect();mx=e.clientX-r.left;my=e.clientY-r.top;
  if(!down)return;
  const dx=e.clientX-sx;moved=Math.max(moved,Math.abs(dx));target=st+dx/PULL();
});
stage.addEventListener('pointerdown',e=>{
  if(e.target.closest('button,a,.dock'))return;
  down=true;sx=e.clientX;st=target;moved=0;stage.setPointerCapture(e.pointerId);ring.classList.add('drag');
});
function release(e){
  if(!down)return;down=false;ring.classList.remove('drag');
  if(moved<6){
    const hit=document.elementsFromPoint(e.clientX,e.clientY).find(x=>x.classList&&x.classList.contains('m'));
    if(hit){let d=wrap(+hit.dataset.i-target,N);d=Math.round(d);if(d>0&&d<N)target=Math.round(target)+d}
  }else target=Math.round(target);
}
stage.addEventListener('pointerup',release);stage.addEventListener('pointercancel',release);
stage.addEventListener('wheel',e=>{
  e.preventDefault();target+=clamp(e.deltaY+e.deltaX,-120,120)/420;
  clearTimeout(wheelT);wheelT=setTimeout(()=>{target=Math.round(target)},150);
},{passive:false});

// Rail (Accessories column) wheel & drag scroll up/down
rail.addEventListener('wheel',e=>{
  e.preventDefault();
  const delta=e.deltaY+e.deltaX;
  target+=clamp(delta,-100,100)/260;
  clearTimeout(wheelT);
  wheelT=setTimeout(()=>{target=Math.round(target)},150);
},{passive:false});

let railDown=false,railStartPos=0,railStartTarget=0,railMoved=0;
rail.addEventListener('pointerdown',e=>{
  if(e.target.closest('button'))return;
  railDown=true;
  railStartPos=side?e.clientX:e.clientY;
  railStartTarget=target;
  railMoved=0;
  rail.setPointerCapture(e.pointerId);
});
rail.addEventListener('pointermove',e=>{
  if(!railDown)return;
  const curPos=side?e.clientX:e.clientY;
  const delta=curPos-railStartPos;
  railMoved=Math.max(railMoved,Math.abs(delta));
  const step=Math.max(cardS,120);
  target=railStartTarget-delta/(step*2);
});
const onRailUp=e=>{
  if(!railDown)return;
  railDown=false;
  try{rail.releasePointerCapture(e.pointerId)}catch(_){}
  target=Math.round(target);
};
rail.addEventListener('pointerup',onRailUp);
rail.addEventListener('pointercancel',onRailUp);

// Keyboard controls
addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown'].includes(e.key)){e.preventDefault();target=Math.round(target)+1}
  if(['ArrowLeft','ArrowUp'].includes(e.key)){e.preventDefault();target=Math.round(target)-1}
  if(e.key==='Escape'){
    try{
      if(window.parent&&window.parent!==window){
        window.parent.postMessage({type:'CLOSE_RUNWAY'},'*');
      }
    }catch(_){}
  }
});

function loop(t){frame(t);requestAnimationFrame(loop)}

// Initial setup
size();
updateLookUI(currentLookIndex);
paint();
requestAnimationFrame(loop);
</script>
